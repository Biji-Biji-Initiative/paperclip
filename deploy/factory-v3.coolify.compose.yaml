# Paperclip Factory v3: a fresh, current-upstream, private Coolify candidate.
#
# This is deliberately a new data plane rather than an in-place upgrade of
# factory-v2: the upstream source lineage is discontinuous and existing
# experimental state is disposable. It has no public domain by default.
# Coolify health checks use the container-local API while Paperclip's private
# hostname guard rejects arbitrary externally supplied Host headers.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paperclip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-paperclip}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-paperclip}\" -d \"$${POSTGRES_DB:-paperclip}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # r1 deliberately starts a fresh disposable state plane after the
      # initial private candidate's malformed bootstrap configuration.
      - paperclip-factory-v3-r1-pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      PAPERCLIP_BIND: "lan"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_INSTANCE_ID: "factory-v3"
      PAPERCLIP_CONFIG: "/paperclip/instances/factory-v3/config.json"

      # This instance is deliberately authenticated and private.  Do not add a
      # public URL/domain or hostname allowlist until a separate access packet
      # exists. With no configured hostname, only container-local health probes
      # are accepted by the private-hostname guard.
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "true"
      PAPERCLIP_ENABLE_COMPANY_DELETION: "false"

      # Fresh, disposable state receives current upstream migrations, but
      # cannot schedule or invoke agent execution. The worker-level recovery
      # contract owns backups so runtime-local timer state is not authoritative.
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      HEARTBEAT_SCHEDULER_ENABLED: "false"
      PAPERCLIP_DB_BACKUP_ENABLED: "false"

      # Durable keys are explicit and stored only in the dedicated Infisical
      # projection. No ambient AI-provider or host/CAAM credential is injected.
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_SECRETS_MASTER_KEY: "${PAPERCLIP_SECRETS_MASTER_KEY:?PAPERCLIP_SECRETS_MASTER_KEY must be set}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3100/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    volumes:
      - paperclip-factory-v3-r1-data:/paperclip

volumes:
  paperclip-factory-v3-r1-pgdata:
  paperclip-factory-v3-r1-data:
