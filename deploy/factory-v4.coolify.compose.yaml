# Paperclip Factory: v2026.1012.0 plus native staff SSO, preserving V4 state.
#
# Build the selected, pinned fork commit; the stock release lacks staff SSO.
# SOURCE_COMMIT must be available during the Coolify build. Database and instance
# volumes retain their V4 identity across upgrades. Before changing versions,
# prove a restore and run the new image against an isolated copy of that state.
# Stop all old writers before starting the new image (workspace lock protocol).
#
# Before provisioning, prove this source with:
#   IMAGE_NAME=<locally-built-image> scripts/factory-v4-local-smoke.sh
# Keep the application route-free while claiming the first administrator, then
# set PAPERCLIP_AUTH_DISABLE_SIGN_UP=true and verify backup/restore before
# attaching the canonical hostname.
services:
  db:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paperclip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-paperclip}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-paperclip}\" -d \"$${POSTGRES_DB:-paperclip}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - paperclip-factory-v4-r1-pgdata:/var/lib/postgresql/data

  server:
    # These bounds apply to the control plane and its native child processes.
    # Qualify one real run before increasing execution concurrency.
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PAPERCLIP_BUILD_COMMIT: "${SOURCE_COMMIT:?SOURCE_COMMIT must identify the selected fork commit}"
        PAPERCLIP_BUILD_VERSION: "2026.1012.0-factory-sso.2"
        CLI_TOOLS_CACHE_EPOCH: "2026-W42"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      PAPERCLIP_BIND: "lan"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_INSTANCE_ID: "factory-v4"
      PAPERCLIP_CONFIG: "/paperclip/instances/factory-v4/config.json"

      # The public URL is explicit so auth callbacks cannot inherit a proxy
      # hostname. A sealed worker-only bootstrap temporarily permits the
      # dedicated administrator to sign up; the Infisical projection is then
      # locked before this service receives a Coolify route.
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: "https://factory.mereka.io"
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "true"
      PAPERCLIP_AUTHENTIK_REQUIRED: "true"
      PAPERCLIP_AUTHENTIK_ISSUER: "https://auth0.mereka.io/application/o/factory/"
      PAPERCLIP_AUTHENTIK_CLIENT_ID: "paperclip-factory"
      PAPERCLIP_AUTHENTIK_CLIENT_SECRET: "${PAPERCLIP_AUTHENTIK_CLIENT_SECRET:?Staff provider secret must be projected}"
      PAPERCLIP_AUTHENTIK_COMPANY_ID: "${PAPERCLIP_AUTHENTIK_COMPANY_ID:?Staff company must already exist}"
      PAPERCLIP_AUTHENTIK_ALLOW_PASSWORD_LOGIN: "${PAPERCLIP_AUTHENTIK_ALLOW_PASSWORD_LOGIN:-false}"
      PAPERCLIP_AUTHENTIK_RECOVERY_EMAIL: "${PAPERCLIP_AUTHENTIK_RECOVERY_EMAIL:-}"
      PAPERCLIP_AUTHENTIK_RECOVERY_UNTIL: "${PAPERCLIP_AUTHENTIK_RECOVERY_UNTIL:-}"
      PAPERCLIP_ENABLE_COMPANY_DELETION: "false"
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      HEARTBEAT_SCHEDULER_ENABLED: "false"
      PAPERCLIP_DB_BACKUP_ENABLED: "false"

      # Backups are worker-owned and proved independently. Provider keys,
      # CAAM profiles, host directories, Hermes configuration, and agent
      # workspaces are intentionally not projected into this public process.
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_SECRETS_MASTER_KEY: "${PAPERCLIP_SECRETS_MASTER_KEY:?PAPERCLIP_SECRETS_MASTER_KEY must be set}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3100/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    volumes:
      - paperclip-factory-v4-r1-data:/paperclip

volumes:
  # Existing V4 volumes: fail instead of silently creating an empty replacement.
  paperclip-factory-v4-r1-pgdata:
    external: true
    name: xc4zcdntt8nw7kd3vdqkzuo8_paperclip-factory-v4-r1-pgdata
  paperclip-factory-v4-r1-data:
    external: true
    name: xc4zcdntt8nw7kd3vdqkzuo8_paperclip-factory-v4-r1-data
